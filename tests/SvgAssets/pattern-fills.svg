<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <g id="dot">
      <circle cx="0" cy="0" r="7" fill="#1b4f72"/>
      <circle cx="0" cy="0" r="3" fill="#aed6f1"/>
    </g>
    <pattern id="userSpaceDots" patternUnits="userSpaceOnUse" x="0" y="0" width="30" height="30">
      <rect width="30" height="30" fill="#d6eaf8"/>
      <use xlink:href="#dot" x="15" y="15"/>
    </pattern>
    <pattern id="boundingBoxStripes" patternUnits="objectBoundingBox" x="0" y="0" width="0.25" height="0.5">
      <rect width="20" height="20" fill="#fdebd0"/>
      <path d="M 0 20 L 20 0" stroke="#ca6f1e" stroke-width="5" fill="none"/>
    </pattern>
    <pattern id="rotatedChecks" patternUnits="userSpaceOnUse" width="24" height="24" patternTransform="rotate(30) scale(0.9)">
      <rect width="24" height="24" fill="#f9ebea"/>
      <rect width="12" height="12" fill="#922b21"/>
      <rect x="12" y="12" width="12" height="12" fill="#922b21"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="#fdfefe"/>
  <rect x="20" y="20" width="170" height="120" fill="url(#userSpaceDots)" stroke="#1b4f72" stroke-width="2"/>
  <rect x="210" y="20" width="170" height="120" fill="url(#boundingBoxStripes)" stroke="#ca6f1e" stroke-width="2"/>
  <rect x="20" y="165" width="170" height="115" fill="url(#rotatedChecks)" stroke="#922b21" stroke-width="2"/>
  <circle cx="295" cy="222" r="57" fill="url(#userSpaceDots)" stroke="#1b4f72" stroke-width="2"/>
</svg>
