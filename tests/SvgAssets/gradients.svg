<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5f6d"/>
      <stop offset="55%" stop-color="#ffc371"/>
      <stop offset="100%" stop-color="#2bc0e4" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="diagonal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="1" stop-color="#78ffd6"/>
    </linearGradient>
    <radialGradient id="radial" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fffbd5"/>
      <stop offset="70%" stop-color="#b20a2c"/>
      <stop offset="100%" stop-color="#40101d"/>
    </radialGradient>
    <radialGradient id="focal" cx="0.5" cy="0.5" r="0.5" fx="0.3" fy="0.3">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#136a8a"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#202020"/>
  <rect x="20" y="20" width="360" height="70" fill="url(#linear)"/>
  <rect x="20" y="110" width="170" height="80" fill="url(#diagonal)" transform="rotate(-4 105 150)"/>
  <circle cx="290" cy="150" r="55" fill="url(#radial)"/>
  <circle cx="100" cy="245" r="40" fill="url(#focal)"/>
  <rect x="200" y="215" width="170" height="60" fill="url(#linear)" fill-opacity="0.6"/>
</svg>
